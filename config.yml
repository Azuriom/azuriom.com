baseURL: https://azuriom.com/
defaultContentLanguageInSubdir: true
title: Azuriom

enableRobotsTXT: true
disableKinds: [taxonomy, term, RSS, sitemap]
pygmentsUseClasses: true

mediaTypes:
  text/plain:
    suffixes: [txt]

outputFormats:
  Security: # security.txt
    mediaType: text/plain
    baseName: security
    path: .well-known
    isPlainText: true
    notAlternative: true
    root: true

outputs:
  home: [HTML, Security]

markup:
  goldmark:
    parser:
      attribute:
        block: true

params:
  twitter: https://x.com/Azuriom
  discord: https://azuriom.com/discord

languages:
  en:
    label: English
    locale: en-US
    contentDir: content/en
  fr:
