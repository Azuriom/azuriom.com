headline: "Az Azuriom egy teljes nyílt forráskódú webes megoldás a játékszerverekhez. Élvezze a tucatnyi bővítményt a végtelen lehetőségekért. Már több mint 1,800 szerver bízik benne, több mint kétmillió felhasználóval."

